version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: ancient-bridge-db
    environment:
      POSTGRES_DB: ancient_bridges
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mqtt-broker:
    image: eclipse-mosquitto:latest
    container_name: ancient-bridge-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log
    command: mosquitto -c /mosquitto/config/mosquitto.conf

  backend:
    build: ./backend
    container_name: ancient-bridge-backend
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: ancient_bridges
      DB_SSLMODE: disable
      MQTT_BROKER: mqtt-broker
      MQTT_PORT: 1883
      MQTT_CLIENT_ID: bridge-alert-service
      MQTT_TOPIC: bridges/alerts
      STRESS_WARNING_RATIO: 0.8
      STRESS_DANGER_RATIO: 1.0
    depends_on:
      timescaledb:
        condition: service_healthy
      mqtt-broker:
        condition: service_started
    volumes:
      - ./backend:/app

  frontend:
    image: nginx:alpine
    container_name: ancient-bridge-frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

volumes:
  db_data:
  mqtt_data:
  mqtt_log:
